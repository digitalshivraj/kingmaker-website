name: Keep scheduled publishing active

# GitHub turns off scheduled workflows in a public repository after 60 days without
# a commit. Scheduled blog posts depend on the daily deploy, so this adds an empty
# commit once a month.
on:
  schedule:
    - cron: '17 1 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep scheduled publishing active"
          git push
